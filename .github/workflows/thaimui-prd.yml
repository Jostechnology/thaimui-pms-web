name: thaumui-pms-web

on:
  push:
    branches:
      - thaimui-prd
permissions:
  contents: write  # Give the GITHUB_TOKEN permission to push tags

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Docker Buildx for multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Log in to GitLab Container Registry
      - name: Log in to GitLab Container Registry
        uses: docker/login-action@v2
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_USERNAME }}
          password: ${{ secrets.GITLAB_ACCESS_TOKEN }}

      # Build and push the Docker image
      - name: Build and push Docker image
        run: |
          docker build . -t registry.gitlab.com/jostechnology/thaimui-pms-web-prd:${{ github.sha }}
          docker push registry.gitlab.com/jostechnology/thaimui-pms-web-prd:${{ github.sha }}
      # Create a new tag and push it to GitHub
      - name: Create and push Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v$(date +'%Y%m%d%H%M%S')-${{ github.sha }}"
          echo "Creating Git tag $TAG"
          git tag $TAG
          git push origin $TAG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Host is behind VPN — CI runner cannot reach it. Generate the .env
      # here instead of deploying, so it can be downloaded and copied by hand.
      - name: Generate .env
        run: |
          echo "TAG=${{ github.sha }}" > .env
          echo 'VITE_FRONT_API=${{ vars.VITE_FRONT_API_PRD }}' >> .env
          echo 'VITE_GOOGLE_API=${{ vars.VITE_GOOGLE_API_PRD }}' >> .env
          echo 'VITE_DOCUMENT_GENERATOR_URL=${{ vars.VITE_DOCUMENT_GENERATOR_URL_PRD }}' >> .env

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: prd-deploy-files
          include-hidden-files: true
          path: |
            docker-compose.yml
            .env
